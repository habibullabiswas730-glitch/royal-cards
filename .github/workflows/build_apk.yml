name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.royalcards --project-name royal_cards_app .
      - name: Fix Kotlin version
        run: |
           sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.1.0'/" android/settings.gradle
           sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle
      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart
      - name: Add Firebase config
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")

          if settings_kts.exists():
              settings = settings_kts
              app = Path("android/app/build.gradle.kts")

              s = settings.read_text()

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                      1
                  )
                  settings.write_text(s)

              a = app.read_text()

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
                  app.write_text(a)

          elif settings_groovy.exists():
              settings = settings_groovy
              app = Path("android/app/build.gradle")

              s = settings.read_text()

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n        id 'com.google.gms.google-services' version '4.5.0' apply false",
                      1
                  )
                  settings.write_text(s)

              a = app.read_text()

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )
                  app.write_text(a)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-cards-apk
          path: build/app/outputs/flutter-apk/app-release.apk
