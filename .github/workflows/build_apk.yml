name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.royalcards .

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

            - name: Enable Google Services Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if settings.exists() and app.exists():
              s = settings.read_text()

              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'id("dev.flutter.flutter-plugin-loader") version "1.0.0"',
                      'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n    id("com.google.gms.google-services") version "4.4.2" apply false'
                  )
                  settings.write_text(s)

              a = app.read_text()

              if 'com.google.gms.google-services' not in a:
                  a = a.replace(
                      'id("dev.flutter.flutter-gradle-plugin")',
                      'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")'
                  )
                  app.write_text(a)

          else:
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")

              s = settings.read_text()
              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'id "dev.flutter.flutter-plugin-loader" version "1.0.0"',
                      'id "dev.flutter.flutter-plugin-loader" version "1.0.0"\n    id "com.google.gms.google-services" version "4.4.2" apply false'
                  )
                  settings.write_text(s)

              a = app.read_text()
              if 'com.google.gms.google-services' not in a:
                  a = a.replace(
                      'id "dev.flutter.flutter-gradle-plugin"',
                      'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
                  )
                  app.write_text(a)
          PY
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-cards-apk
          path: build/app/outputs/flutter-apk/app-release.apk
