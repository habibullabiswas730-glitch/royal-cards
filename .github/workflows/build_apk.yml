name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.royalcards .

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Enable Google Services Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          s = settings.read_text()
          if 'com.google.gms.google-services' not in s:
              s = s.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false', 1)
              settings.write_text(s)
          app = Path('android/app/build.gradle')
          a = app.read_text()
          if 'id "com.google.gms.google-services"' not in a:
              a = a.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
              app.write_text(a)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-cards-apk
          path: build/app/outputs/flutter-apk/app-release.apk
